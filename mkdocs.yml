      - NodeManagerServiceOperationFailed: runbooks/NodeManagerServiceOperationFailed.md
      - NodeManagerServiceStartLoop: runbooks/NodeManagerServiceStartLoop.md
      - NodeManagerReconcileStuck: runbooks/NodeManagerReconcileStuck.md
