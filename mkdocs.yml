      - NodeManagerJailOperationFailed: runbooks/NodeManagerJailOperationFailed.md
      - NodeManagerPoudriereBuildFailed: runbooks/NodeManagerPoudriereBuildFailed.md
      - NodeManagerPoudriereBuildStale: runbooks/NodeManagerPoudriereBuildStale.md
      - NodeManagerPoudriereBuildLong: runbooks/NodeManagerPoudriereBuildLong.md
